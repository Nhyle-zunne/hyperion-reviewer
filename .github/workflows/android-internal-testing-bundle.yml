name: Android internal-testing App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-internal-testing-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-release-bundle:
    name: Build and verify signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "platform-tools"

      - name: Install compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Validate production Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SERVICES_JSON:-}" ]]; then
            echo "::error::Add the repository Actions secret GOOGLE_SERVICES_JSON containing the real production google-services.json."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("app/google-services.json").read_text())
          clients = cfg.get("client", [])
          expected = "com.nhyle.hyperionmaritime"
          if not any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected for c in clients):
              raise SystemExit("google-services.json does not contain Android package " + expected)
          project_id = cfg.get("project_info", {}).get("project_id", "")
          if not project_id or "placeholder" in project_id.lower():
              raise SystemExit("google-services.json must be the real production Firebase configuration, not the CI placeholder.")
          print("Production Firebase configuration verified for the expected Android package.")
          PY

      - name: Restore upload keystore from Actions secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Add KEYSTORE_BASE64 as a base64-encoded copy of the upload keystore currently accepted by Play Console. Do not use a debug key or a key whose registration is still pending."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/hyperion-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed release App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hyperion-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HYPERION_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HYPERION_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${STORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::Add KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          if [[ -z "${HYPERION_GOOGLE_WEB_CLIENT_ID:-}" ]]; then
            echo "::error::HYPERION_GOOGLE_WEB_CLIENT_ID is missing."
            exit 1
          fi
          gradle --no-daemon --max-workers=2 --stacktrace bundleRelease

      - name: Verify the bundle signature
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -certs "$AAB"
          echo "Bundle signature verification passed."
          keytool -printcert -jarfile "$AAB"

      - name: Write build metadata
        run: |
          {
            echo "Package: com.nhyle.hyperionmaritime"
            echo "Version code and version name are configured in app/build.gradle.kts."
            echo "Built from commit: $GITHUB_SHA"
            echo "Artifact: app-release.aab"
            echo "Upload this bundle to Play Console > Testing > Internal testing."
            echo "Do not share the upload keystore or passwords."
          } > app/build/outputs/bundle/release/UPLOAD-README.txt

      - name: Upload signed App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-maritime-internal-testing-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/UPLOAD-README.txt
          if-no-files-found: error
          retention-days: 14
