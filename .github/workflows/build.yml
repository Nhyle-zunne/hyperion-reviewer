name: Build Android App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Force release build to sign with the debug key so it generates the .aab without needing private credentials
    - name: Build App Bundle
      run: gradle bundleRelease -Pandroid.injected.signing.store.file="" -x signReleaseBundle --stacktrace || gradle bundleRelease -Dorg.gradle.project.android.injected.signing.store.file=""

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/build/outputs/bundle/**/*.aab"
        retention-days: 7
