name: Build Android App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Allows setup-gradle to use the latest stable Gradle 9 that satisfied your AGP 9.1.1 earlier
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 'current'

    # Pre-generates the debug keystore so :signReleaseBundle finds it and avoids NullPointerException
    - name: Prepare Debug Keystore
      run: |
        mkdir -p $HOME/.android
        keytool -genkey -v -keystore $HOME/.android/debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Build App Bundle
      run: |
        gradle bundleRelease \
          -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=androiddebugkey \
          -Pandroid.injected.signing.key.password=android \
          --stacktrace

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/build/outputs/bundle/release/*.aab"
        retention-days: 7
