name: Android account-linking build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-account-linking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit-test:
    name: Compile Android app and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "platform-tools"

      - name: Install compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create temporary Firebase config for compile-only CI
        # The repository intentionally does not contain production Firebase
        # configuration. This placeholder only satisfies the Google Services
        # Gradle plugin for compiling; it cannot authenticate to a real project.
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "hyperion-ci-placeholder",
              "storage_bucket": "hyperion-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.nhyle.hyperionmaritime"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI_PLACEHOLDER_NOT_FOR_PRODUCTION"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Compile and run unit tests
        # Real Firebase/OAuth configuration and a real-device sign-in test
        # are still required before release.
        run: gradle --no-daemon --max-workers=2 --stacktrace testDebugUnitTest assembleDebug
