name: Android account-linking build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-account-linking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit-test:
    name: Compile Android app and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "platform-tools"

      - name: Install compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Create temporary Firebase config for compile-only CI
        # The repository intentionally does not contain production Firebase
        # configuration. This placeholder only satisfies the Google Services
        # Gradle plugin for compiling; it cannot authenticate to a real project.
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "hyperion-ci-placeholder",
              "storage_bucket": "hyperion-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.nhyle.hyperionmaritime"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI_PLACEHOLDER_NOT_FOR_PRODUCTION"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build installable debug APK
        # The Web OAuth client ID is optional for a compile-only build. When the
        # repository secret is configured, the debug APK can exercise Google sign-in.
        # Production Firebase config and real-device acceptance testing remain separate.
        env:
          HYPERION_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HYPERION_GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --max-workers=2 --stacktrace assembleDebug

      - name: Export debug signing-certificate SHA-1
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA1: //p' \
            | head -n 1 > app/build/outputs/apk/debug/DEBUG_CERT_SHA1.txt
          test -s app/build/outputs/apk/debug/DEBUG_CERT_SHA1.txt

      - name: Write test-build configuration note
        env:
          HYPERION_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HYPERION_GOOGLE_WEB_CLIENT_ID }}
        run: |
          {
            echo "Hyperion Maritime Android debug test build"
            echo "Package: com.nhyle.hyperionmaritime"
            echo "Debug signing-certificate SHA-1 is in DEBUG_CERT_SHA1.txt."
            if [ -n "$HYPERION_GOOGLE_WEB_CLIENT_ID" ]; then
              echo "Web OAuth client ID: supplied to this build (value intentionally not printed)."
            else
              echo "Web OAuth client ID: NOT supplied. Google sign-in will show the setup-required error until the HYPERION_GOOGLE_WEB_CLIENT_ID GitHub Actions secret is configured and the build is rebuilt."
            fi
            echo "Register this debug signing SHA-1 in the Android OAuth client in Google Cloud before testing native Google sign-in."
            echo "This is a debug-signed sideload build, not a Play Store release."
          } > app/build/outputs/apk/debug/TESTING_README.txt

      - name: Write APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload installable debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-maritime-account-linking-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/DEBUG_CERT_SHA1.txt
            app/build/outputs/apk/debug/TESTING_README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run Android unit tests
        run: gradle --no-daemon --max-workers=2 --stacktrace testDebugUnitTest
