name: Android account-linking build

on:
  push:
    branches:
      - feature/android-account-signin-and-web-licenses
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-account-linking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit-test:
    name: Compile Android app and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "platform-tools"

      - name: Install compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile and run unit tests
        # google-services.json is deliberately not committed. Exclude only its
        # generated-resource task for this credential-free compile check; a
        # separate device test with the real Firebase/OAuth configuration is
        # still required before release.
        run: gradle --no-daemon --stacktrace -x processDebugGoogleServices testDebugUnitTest assembleDebug
