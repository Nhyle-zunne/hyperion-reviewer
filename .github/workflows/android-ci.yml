name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional Gradle test pattern for focused diagnostics; blank runs the full suite
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-skills:
    name: Verify repository agent skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify pinned skills and instructions
        run: node scripts/tests/agent-skills-test.mjs

  test-and-build:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.test_filter != '' && 'Focused tests and lint (manual diagnostics)' || 'Unit tests and lint' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Block plaintext question banks and verify encrypted manifest
        run: python3 scripts/tests/question-bank-asset-safety.py

      - name: Run Android unit tests
        env:
          TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_filter || '' }}
        run: |
          filter_args=()
          if [[ -n "$TEST_FILTER" ]]; then
            filter_args+=(--tests "$TEST_FILTER")
          fi
          gradle --no-daemon :app:testDebugUnitTest "${filter_args[@]}"

      - name: Run Android static analysis
        run: gradle --no-daemon :app:lintDebug

      - name: Assemble debug app (no artifact upload)
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contains only encrypted question banks
        run: python3 scripts/tests/question-bank-asset-safety.py --artifact app/build/outputs/apk/debug/app-debug.apk

